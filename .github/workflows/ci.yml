name: CI

on:
  pull_request:

jobs:
  probe:
    # Throwaway, never merged: the page on an ordinary machine, against production.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --prefer-offline
      - run: pnpm exec playwright install --with-deps chromium
      - run: nproc; lscpu | grep -E 'Model name|Thread|Core|MHz'; free -m | head -2
      - run: pnpm exec tsx scripts/probe-ordinary.ts
